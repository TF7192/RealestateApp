# Production compose — pulls pre-built images from GHCR rather than
# building on the EC2. The deploy pipeline sets ESTIA_TAG to the
# commit short-SHA before calling `docker compose up -d`, so the same
# file drives both forward deploys and rollbacks (pick a different
# tag, up).
#
# Why separate from docker-compose.yml:
#   • docker-compose.yml keeps `build:` for local dev (so you can work
#     off your checkout without GHCR access).
#   • This file uses `image:` so the EC2 never needs source, never
#     rebuilds, and rollbacks are one pull away.
#
# The EC2 logs in to GHCR on every deploy with the runner-minted
# GITHUB_TOKEN (short-lived, scoped to the package) — no long-lived
# PAT lives on the host.

services:
  backend:
    image: ghcr.io/tf7192/estia-backend:${ESTIA_TAG:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      # /app/uploads is ephemeral by design — UPLOADS_BACKEND=s3 in .env
      # routes writes to S3. See docker-compose.yml header note.
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-6002}:4000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    pull_policy: always          # `docker compose up -d` always grabs
                                 # the newest image for the tag, so a
                                 # re-push of `:main` without a SHA
                                 # change still lands.

  frontend:
    image: ghcr.io/tf7192/estia-frontend:${ESTIA_TAG:-main}
    restart: unless-stopped
    depends_on: [ backend ]
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3001}:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    pull_policy: always

  # Market Discovery (2026-04-27) — hourly Yad2 metadata watcher.
  # Separate container by design (per spec): the CRM keeps working
  # if the watcher is stopped or fails. No port binding — the
  # watcher only writes to the same RDS the backend reads.
  #
  # LEGAL/SAFETY: stores SAFE METADATA ONLY (no images, no
  # descriptions, no phones, no HTML). See MARKET_DISCOVERY_PLAN.md
  # and services/market-metadata-watcher/src/extractors/yad2-listing.ts.
  market-watcher:
    image: ghcr.io/tf7192/estia-market-watcher:${ESTIA_TAG:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Hourly cadence + ±10min jitter is the spec default. Override
      # via the .env file on the host if you need to tune for an
      # incident.
      MARKET_WATCHER_INTERVAL_MS: "3600000"
      MARKET_WATCHER_JITTER_MS: "600000"
      # Min match score to fire a Notification. Default 70 per the
      # plan doc; bump to 80+ if matches feel noisy.
      MARKET_MATCH_MIN_SCORE: "70"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    pull_policy: always
