# Production compose — pulls pre-built images from GHCR rather than
# building on the EC2. The deploy pipeline sets ESTIA_TAG to the
# commit short-SHA before calling `docker compose up -d`, so the same
# file drives both forward deploys and rollbacks (pick a different
# tag, up).
#
# BLUE-GREEN MIGRATION (in progress, 2026-04-27):
#   The blue-green-capable compose template lives at
#   `docker-compose.prod.blue-green.yml`. Once the host nginx is
#   migrated to the template in `infra/nginx/estia.conf` and the
#   four-service set is bootstrapped (see `infra/README.md`),
#   `scripts/deploy-blue-green.sh` becomes the active deploy path
#   and this file is replaced. Until then the existing single-color
#   path keeps shipping.

services:
  backend:
    image: ghcr.io/tf7192/estia-backend:${ESTIA_TAG:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      # /app/uploads is ephemeral by design — UPLOADS_BACKEND=s3 in .env
      # routes writes to S3. See docker-compose.yml header note.
      UPLOADS_DIR: /app/uploads
    ports:
      # Port range so `docker compose up --scale backend=N` (PERF —
      # 2026-05-01) auto-allocates a host-side port per replica. With
      # a literal `:6002:4000`, the second replica fails to bind and
      # only the first comes up. Range stays inside 127.0.0.1 so the
      # backend remains internal-only — public traffic flows through
      # the frontend nginx upstream `backend:4000` (which uses Docker's
      # embedded DNS round-robin, see frontend/nginx.conf resolver).
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:${BACKEND_PORT_RANGE:-6002-6003}:4000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    pull_policy: always          # `docker compose up -d` always grabs
                                 # the newest image for the tag, so a
                                 # re-push of `:main` without a SHA
                                 # change still lands.

  frontend:
    image: ghcr.io/tf7192/estia-frontend:${ESTIA_TAG:-main}
    restart: unless-stopped
    depends_on: [ backend ]
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3001}:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    pull_policy: always

  # Market Discovery (2026-04-27) — hourly Yad2 metadata watcher.
  # Separate container by design (per spec): the CRM keeps working
  # if the watcher is stopped or fails. No port binding — the
  # watcher only writes to the same RDS the backend reads.
  #
  # LEGAL/SAFETY: stores SAFE METADATA ONLY (no images, no
  # descriptions, no phones, no HTML). See MARKET_DISCOVERY_PLAN.md
  # and services/market-metadata-watcher/src/extractors/yad2-listing.ts.
  market-watcher:
    image: ghcr.io/tf7192/estia-market-watcher:${ESTIA_TAG:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MARKET_WATCHER_INTERVAL_MS: "3600000"
      MARKET_WATCHER_JITTER_MS: "600000"
      MARKET_MATCH_MIN_SCORE: "70"
      # Residential proxy pool. Two ways to configure (file wins):
      #   1) WATCHER_PROXIES_FILE=/run/proxies.txt — bind-mounted below.
      #      Preferred for large pools (e.g. DataImpulse's 2999-port
      #      gateway list).
      #   2) WATCHER_PROXIES=http://user:pass@ip1:port,...
      #      Inline comma- or newline-separated; fine for small pools.
      # Per-call round-robin; empty = direct.
      WATCHER_PROXIES_FILE: /run/proxies.txt
      WATCHER_PROXIES: ${WATCHER_PROXIES:-}
    volumes:
      # Mount the host-side proxy list read-only into the container.
      # The file is gitignored (DataImpulse credentials). If the host
      # file doesn't exist, Docker creates an empty placeholder dir —
      # proxy.ts treats an unparseable/empty source as "no pool" and
      # falls back to direct, so this stays safe.
      - ./services/market-metadata-watcher/proxies.txt:/run/proxies.txt:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    pull_policy: always
    stop_grace_period: 30s
    # Chromium needs proper /dev/shm headroom in containers. Default
    # Docker /dev/shm is 64MB which causes hangs on JS-heavy pages
    # (Reblaze JS challenge stalls). 1GB matches Playwright's
    # official Docker image. Combined with --disable-dev-shm-usage
    # in the Chromium launch args this is belt-and-braces.
    shm_size: 1gb
