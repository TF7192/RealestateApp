# Estia production host nginx config — blue-green capable.
#
# Install once (one-time migration to blue-green):
#   sudo cp infra/nginx/estia.conf /etc/nginx/conf.d/estia.conf
#   sudo nginx -t && sudo nginx -s reload
#
# After install, `scripts/deploy-blue-green.sh` flips between the
# two upstream ports atomically. Look for the `# backend-active`
# and `# frontend-active` markers — those are what sed targets.
#
# Initial state: backend-active=6002 (blue), frontend-active=3001
# (blue). On first deploy the script flips to green.
#
# Letsencrypt + Cloudflare Flexible: the cert is still scoped to
# estia.tripzio.xyz; Cloudflare accepts any cert in "Full" mode so
# estia.co.il works through the same vhost.

upstream estia_api {
    server 127.0.0.1:6002; # backend-active
    server 127.0.0.1:6003 backup; # backend-inactive
    keepalive 32;
}

upstream estia_web {
    server 127.0.0.1:3001; # frontend-active
    server 127.0.0.1:3002 backup; # frontend-inactive
    keepalive 32;
}

# Port 80 — Cloudflare Flexible fallback + ACME challenge.
server {
    listen 80;
    server_name estia.co.il estia.tripzio.xyz www.estia.co.il;

    # ACME http-01 challenge stays plaintext.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # /api/* split out so the deploy script can flip backend
    # independently of frontend.
    location /api/ {
        proxy_pass http://estia_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Bumped from defaults — large CRM operations (Excel import,
        # voice transcription) and AI streaming need bigger budgets.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        # File upload size — see backend's @fastify/multipart limit.
        client_max_body_size  100M;
        # WebSocket support for /api/ai/chat/ws.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location / {
        proxy_pass http://estia_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# Port 443 — Cloudflare Full mode + Let's Encrypt cert.
server {
    listen 443 ssl http2;
    server_name estia.co.il estia.tripzio.xyz www.estia.co.il;

    ssl_certificate     /etc/letsencrypt/live/estia.tripzio.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estia.tripzio.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://estia_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size  100M;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location / {
        proxy_pass http://estia_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# Top-level map for WebSocket Upgrade header — required by the
# /api/ai/chat/ws path. Lives at http-scope per the CLAUDE.md note.
# Move to /etc/nginx/conf.d/ws-upgrade.conf if conflicting with
# another vhost.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
